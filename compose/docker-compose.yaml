services:
  postgres:
    image: postgres:17
    container_name: portflow-postgres
    environment:
      POSTGRES_DB: portflow
      POSTGRES_USER: portflow
      POSTGRES_PASSWORD: portflow
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - portflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow -d portflow"]
      interval: 5s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:8
    container_name: portflow-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: portflow
      MONGO_INITDB_ROOT_PASSWORD: portflow
      MONGO_INITDB_DATABASE: terminal_service
    ports:
      - "27017:27017"
    volumes:
      - portflow-mongodb-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mongosh", "--username", "portflow", "--password", "portflow", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-express:
    image: mongo-express:1.0.2
    container_name: portflow-mongo-express
   # depends_on:
    #  mongodb:
     #   condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: portflow
      ME_CONFIG_MONGODB_ADMINPASSWORD: portflow
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8082:8081"
  kafka:
    image: apache/kafka:4.1.0
    container_name: portflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - portflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: portflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: portflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092


  prometheus:
    image: prom/prometheus:latest
    container_name: portflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - portflow-prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
  grafana:
    image: grafana/grafana:latest
    container_name: portflow-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - portflow-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  portflow-postgres-data:
  portflow-mongodb-data:
  portflow-kafka-data:
  portflow-prometheus-data:
  portflow-grafana-data: