services:
  postgres-legado:
    image: postgres:17
    container_name: portflow-postgres-legado
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: portflow_legado
      POSTGRES_USER: portflow
      POSTGRES_PASSWORD: portflow
    ports:
      - "5433:5432"
    volumes:
      - portflow-postgres-legado-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow -d portflow_legado"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portflow-network



  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: portflow-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # Desabilita JMX/RMI para evitar warnings de RMI TCP Accept
      KAFKA_JMX_PORT: ""
      KAFKA_JMX_HOSTNAME: ""
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=false"
      KAFKA_OPTS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"
      JAVA_TOOL_OPTIONS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"

      # KRaft mode, sem Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # Listeners internos e externos
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single broker para laboratório
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Auto criação de tópicos para facilitar a aula
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Cluster ID fixo para KRaft
      CLUSTER_ID: portflow-kafka-cluster-001
    volumes:
      - portflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - portflow-network

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: portflow-kafka-connect
    ports:
      - "8083:8083"
    environment:
      # Desabilita JMX/RMI para evitar warnings de RMI TCP Accept
      KAFKA_JMX_PORT: ""
      KAFKA_JMX_HOSTNAME: ""
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=false"
      KAFKA_OPTS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"
      JAVA_TOOL_OPTIONS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"

      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: portflow-connect-cluster

      CONFIG_STORAGE_TOPIC: portflow_connect_configs
      OFFSET_STORAGE_TOPIC: portflow_connect_offsets
      STATUS_STORAGE_TOPIC: portflow_connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: kafka-connect
      REST_PORT: 8083

      # Facilita uso didático com JSON sem schema
      CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-connector-postgres,/debezium-connector-mysql,/debezium-connector-mongodb,/debezium-connector-sqlserver,/debezium-connector-oracle
    depends_on:
      kafka:
        condition: service_healthy
      postgres-legado:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - portflow-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: portflow-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: portflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: portflow-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    networks:
      - portflow-network
volumes:
  portflow-postgres-legado-data:
  portflow-neo4j-data:
  portflow-neo4j-logs:
  portflow-neo4j-import:
  portflow-neo4j-plugins:
  portflow-kafka-data:

networks:
  portflow-network:
    driver: bridge