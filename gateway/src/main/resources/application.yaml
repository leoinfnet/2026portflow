spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: container-service
              uri: lb://CONTAINER-SERVICE
              predicates:
                - Path=/api/containers/**
              filters:
                - StripPrefix=2
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/

server:
  port: 9999
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway